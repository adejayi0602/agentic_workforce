# Local development stack. Not for staging or production; those run on AWS (spec §12).
# Credentials below are local placeholders only.

name: agentic-workforce

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: workforce
      POSTGRES_PASSWORD: workforce
      POSTGRES_DB: workforce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/postgres-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforce -d workforce"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Temporal dev server (SQLite-backed, persisted to a volume) with the web UI on 8233.
  # The Temporal hosting decision for AWS is ADR-0010.
  temporal:
    image: temporalio/temporal:latest
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /data/temporal.db
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/data

  # S3-compatible object storage for uploads, artefacts and evidence (ADR-0013).
  # SeaweedFS replaced MinIO, whose public images were withdrawn. Local only: no credentials
  # are enforced, and browser uploads are allowed from any origin.
  s3:
    image: chrislusf/seaweedfs:4.54
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-master.volumeSizeLimitMB=100"]
    ports:
      - "9000:9000"
    volumes:
      - s3-data:/data

  # Creates the buckets the API expects (versioning on where supported, spec §12 Files).
  s3-setup:
    image: amazon/aws-cli:latest
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-west-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 30); do aws --endpoint-url http://s3:9000 s3 ls >/dev/null 2>&1 && break; sleep 2; done
        for b in workforce-uploads workforce-artefacts workforce-evidence; do
          aws --endpoint-url http://s3:9000 s3 mb s3://$$b || true
          aws --endpoint-url http://s3:9000 s3api put-bucket-versioning --bucket $$b \
            --versioning-configuration Status=Enabled || true
        done
    restart: "no"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  temporal-data:
  s3-data:
