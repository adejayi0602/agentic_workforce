[project]
name = "workforce-contracts"
version = "0.1.0"
description = "Shared typed contracts for the Agentic IT Workforce platform"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workforce_contracts"]
