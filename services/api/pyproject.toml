[project]
name = "workforce-api"
version = "0.1.0"
description = "FastAPI modular monolith for the Agentic IT Workforce platform"
requires-python = ">=3.12"
dependencies = [
  "workforce-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pyjwt[crypto]>=2.10",
  "email-validator>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workforce_api"]
