name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WORKFORCE_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy packages/contracts/src packages/intake/src services/api/src services/workers/src
      - name: OpenAPI contract is up to date
        run: |
          uv run python services/api/scripts/export_openapi.py
          git diff --exit-code packages/contracts/openapi.json || {
            echo "::error::packages/contracts/openapi.json is stale. Run 'make contracts' and commit."
            exit 1
          }
      - name: Unit tests
        run: uv run pytest
      - name: Integration tests (PostgreSQL row-level security, Temporal test server)
        run: uv run pytest -m integration

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api-types.ts || {
            echo "::error::apps/web/src/lib/api-types.ts is stale. Run 'make contracts' and commit."
            exit 1
          }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  compose:
    name: Local stack config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: postgres
      WORKFORCE_MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/workforce
      E2E_DATABASE_URL: postgresql+asyncpg://workforce_api:workforce_api@localhost:5432/workforce
      E2E_S3_ENDPOINT_URL: http://localhost:9000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --all-packages --locked
      - name: Create database and roles (same script as the local stack)
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE workforce"
          psql -h localhost -U postgres -d workforce -f infra/local/postgres-init.sql
      - name: Migrate
        working-directory: services/api
        run: uv run alembic upgrade head
      - name: Start S3 (SeaweedFS, as in compose.yaml) and the Temporal dev server
        run: |
          docker run -d --name s3 -p 9000:9000 chrislusf/seaweedfs:4.54 \
            server -dir=/data -s3 -s3.port=9000 -master.volumeSizeLimitMB=100
          docker run -d --name temporal -p 7233:7233 \
            temporalio/temporal:latest server start-dev --ip 0.0.0.0
          for i in $(seq 60); do
            (nc -z localhost 9000 && nc -z localhost 7233) && break; sleep 2
          done
      - name: Create buckets
        run: |
          uv run python - <<'PY'
          import time, boto3
          s3 = boto3.client("s3", endpoint_url="http://localhost:9000", region_name="eu-west-1")
          for attempt in range(30):
              try:
                  for bucket in ("workforce-uploads", "workforce-artefacts"):
                      s3.create_bucket(Bucket=bucket)
                  break
              except Exception as exc:
                  print("waiting for S3:", exc); time.sleep(2)
          PY
      - name: Start the document worker
        env:
          WORKFORCE_ENV: test
          WORKFORCE_SCANNER: eicar
          WORKFORCE_WORKER_DATABASE_URL: postgresql+asyncpg://workforce_worker_login:workforce_worker@localhost:5432/workforce
          WORKFORCE_S3_ENDPOINT_URL: http://localhost:9000
        run: |
          nohup uv run --package workforce-workers python -m workforce_workers.worker > worker.log 2>&1 &
          sleep 5
          cat worker.log
      - name: Build web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: apps/web
        run: npm run e2e
      - name: Service logs
        if: failure()
        run: |
          docker logs s3 2>&1 | tail -40 || true
          docker logs temporal 2>&1 | tail -20 || true
          cat worker.log || true
      - name: Upload report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            worker.log
          retention-days: 7
